services:
  - type: web
    name: plantfarma
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.13

      - key: SECRET_KEY
        generateValue: true

      - key: MYSQL_USER
        sync: false

      - key: MYSQL_PASSWORD
        sync: false

      - key: MYSQL_HOST
        sync: false

      - key: MYSQL_PORT
        value: "3306"

      - key: MYSQL_DATABASE
        sync: false
